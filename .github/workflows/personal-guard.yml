# Сторож личного: путь с машины не уезжает в публичный репозиторий.
# Падает, если коммит ДОБАВИЛ строку с путём вида C:\..., C:/..., /home/...,
# /Users/..., /c/my_... без объявленного исключения [путь-осознанно] — см.
# .claude/skills/wiki-lint/scripts/personal_guard.py
#
# Почему в CI, а не в локальном pre-commit: коммиты сюда шлёт облачная рутина
# ночью, у неё локальных хуков нет вовсе — она работает из свежего клона.
# Проверка на стороне GitHub — единственная, через которую проходят и рутина,
# и человек за клавиатурой.
#
# Почему без фильтра paths, в отличие от сторожа инкрементальности: тот следит
# за порядком ведения wiki/sources/, а этот — за тем, что уходит в публикацию.
# Утечка может приехать любым файлом, включая настройки и сами скиллы.
name: Сторож личного

on: push

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история, чтобы пройти по коммитам push'а
      - name: Проверить, что в коммитах нет путей с машины
        run: python .claude/skills/wiki-lint/scripts/personal_guard.py "${{ github.event.before }}"
