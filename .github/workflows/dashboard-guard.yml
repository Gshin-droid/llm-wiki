# Сторож дашборда. Падает, если дата в шапке wiki/dashboard.html разошлась с
# датой верхней записи wiki/log.md — см.
# .claude/skills/wiki-lint/scripts/dashboard_guard.py
#
# Почему в CI, а не в локальном pre-commit: коммиты сюда шлёт облачная рутина,
# у которой локальных хуков нет вовсе. Проверка на стороне GitHub — единственная,
# через которую проходят и рутина, и человек.
#
# Почему сторож вообще: дашборд — представление журнала, а не отдельный документ,
# но поддерживается отдельной рукой параллельно с ним. Правило «правка одной
# строки каталога обновлением дашборда не считается» жило в CLAUDE.md текстом и
# три раза не сработало (12–13.08, 06.08, 09.09) — опубликованная страница
# показывала позапрошлые новости. Текст правила ничего не гарантирует.
name: Сторож дашборда

on:
  push:
    paths:
      - 'wiki/dashboard.html'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что дашборд не отстал от журнала
        run: python .claude/skills/wiki-lint/scripts/dashboard_guard.py
