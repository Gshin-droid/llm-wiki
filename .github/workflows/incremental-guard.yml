# Сторож инкрементальности: одна доведённая находка — один коммит и push.
# Падает, если коммит добавляет больше одной новой страницы в wiki/sources/
# без объявленного исключения [батч] — см.
# .claude/skills/wiki-lint/scripts/incremental_guard.py
#
# Почему в CI, а не в локальном pre-commit: коммиты сюда шлёт облачная
# рутина, у которой локальных хуков нет вовсе. Проверка на стороне GitHub —
# единственная, через которую проходят и рутина, и человек.
#
# Почему сторож вообще: правило было записано текстом в CLAUDE.md после того,
# как 10.07.2026 весь разбор потерялся на лимите подписки перед финальным
# пушем. Текст правила ничего не гарантирует — гарантирует перехватчик.
name: Сторож инкрементальности

on:
  push:
    paths:
      - 'wiki/sources/**'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история, чтобы пройти по коммитам push'а
      - name: Проверить, что находки коммитились по одной
        run: python .claude/skills/wiki-lint/scripts/incremental_guard.py "${{ github.event.before }}"
